{% extends "base.html" %}
{% load crispy_forms_tags %}

{% block title %}
    {{ page_title }} | DevBlogs
{% endblock title %}

{% block content %}

<!-- Header -->
<section class="bg-[#171717] text-white">
    <div class="max-w-5xl mx-auto px-6 py-16">
        <div class="max-w-3xl">
            <p class="text-gold-400 uppercase tracking-[0.25em] text-sm font-semibold">
                DevBlogs
            </p>
            <h1 class="font-display text-4xl md:text-5xl font-bold mt-4">
                {{ page_title }}
            </h1>
            <p class="mt-5 text-gray-400 text-lg">
                Share your knowledge, ideas and experiences with the developer community.
            </p>
        </div>
    </div>
</section>

<!-- Form -->
<section class="py-16">
    <div class="max-w-5xl mx-auto px-6">
        <div class="bg-white border border-gray-200 rounded-2xl shadow-sm p-6 md:p-10">
            {% crispy form %}
        </div>
    </div>
</section>

{% endblock content %}
