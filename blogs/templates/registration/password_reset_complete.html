{% extends "registration/base.html" %}

{% block content %}
<div class="container mx-auto mt-8">
  <div class="max-w-md mx-auto bg-white rounded-lg shadow-md overflow-hidden">
    <div class="bg-gray-200 px-6 py-4">
      <h3 class="text-center text-xl font-semibold text-gray-700">Password Reset Complete</h3>
    </div>
    <div class="px-6 py-4 text-center">
      <p class="text-sm text-gray-700 mb-6">
        Your password has been set. You may now go ahead and log in with your new credentials.
      </p>
      <a href="{% url 'login' %}" class="inline-block w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2 px-4 rounded">
        Log In
      </a>
    </div>
  </div>
</div>
{% endblock %}
