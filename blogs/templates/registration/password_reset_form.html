{% extends "base.html" %}
{% load crispy_forms_tags %}

{% block content %}
<div class="container mx-auto mt-8">
  <div class="max-w-md mx-auto bg-white rounded-lg shadow-md overflow-hidden">
    <div class="bg-gray-200 px-6 py-4">
      <h3 class="text-center text-xl font-semibold text-gray-700">Reset Password</h3>
    </div>
    <div class="px-6 py-4">
      <p class="text-sm text-gray-600 mb-4 text-center">
        Enter your email address below and we'll send you instructions to reset your password.
      </p>
      <form method="post">
        {% csrf_token %}
        {{ form|crispy }}
        <div class="mt-6">
          <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2 px-4 rounded focus:outline-none">
            Send Reset Email
          </button>
        </div>
      </form>
      <p class="mt-4 text-center text-sm text-gray-600">
        Remembered your password? <a href="{% url 'login' %}" class="text-indigo-600 font-semibold">Log In</a>
      </p>
    </div>
  </div>
</div>
{% endblock %}
