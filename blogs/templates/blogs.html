{% extends "base.html" %}
{% load static %}

{% block title %}Blogs{% endblock title %}

{% block content %}
<div class="max-w-6xl mx-auto p-6 grid grid-cols-1 md:grid-cols-3 gap-6">
    {% for post in posts %}
    <div class="bg-white p-6 rounded-lg shadow border border-gray-200">
        <h1 class="text-xl font-bold text-gray-800 mb-2">{{ post.title|capfirst }}</h1>
        <p class="text-gray-600 mb-4">{{ post.content|capfirst|truncatechars:30 }}</p>
        <a href="{% url 'blog_detail' post.slug %}" class="text-yellow-500 font-semibold hover:underline">Read More</a>
    </div>
    {% endfor %}
</div>
{% endblock content %}
